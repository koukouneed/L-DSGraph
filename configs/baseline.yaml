data:
  root_data_path: "dataset/"
  sbfl_data_path: "dataset/"
  gramus_data_path: ""
  difficulty_file: "dataset/difficulty.txt"
  data_source: "pickle"
  sbfl_type: "mergeSBFLALL"
  use_original_coverage_matrix: true   # false时覆盖率矩阵列置零，同时置零pass_covered/fail_covered等全部cov特征
  use_sbfl: true   # true=使用SBFL频谱矩阵（默认）, false=禁用SBFL，仅保留AST+词法特征
  use_dense_adj: false   # false=使用稀疏边索引（默认）, true=使用稠密邻接矩阵
  hash_num_bins: 64
  use_full_ast: true   # true=使用完整AST(ASTtreefull.json), false=使用简化AST(ASTtree.json)
  ast_granularity: "fine"   # AST粒度控制: "fine"=细粒度(从root_data_path加载完整AST), "statement"=语句级(从sbfl_data_path加载语句级AST)
  stmt_length_file: "dataset/lengs.txt"

training:
  seed: 0
  batch_size: 60
  patience: 30
  use_validation: true
  save_model: true
  model_dir: "model"
  weight_decay: 0.001
  loss_alpha: 0.7
  loss_beta: 0.3
  l1_lambda: 0.0005
  scheduler_T0: 20
  scheduler_T_mult: 2
  grad_clip: 1.0

