  - name: "l_dsgraph_balanced_gate"
    gnn_type: "l_dsgraph_ablation"
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    num_heads: 5
    cv_method: "kfold"
    k_folds: 5
    variant: "full"
    sbfl_type: "mergeSBFLALL"
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    fusion_type: "balanced_gate"

  - name: "l_dsgraph_balanced_gate_edge"
    gnn_type: "l_dsgraph_ablation"
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    num_heads: 5
    cv_method: "kfold"
    k_folds: 5
    variant: "full"
    sbfl_type: "mergeSBFLALL"
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    fusion_type: "balanced_gate"
    use_edge_type: true

  - name: "l_dsgraph_cross_attn"
    gnn_type: "l_dsgraph_ablation"
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    num_heads: 5
    cv_method: "kfold"
    k_folds: 5
    variant: "full"
    sbfl_type: "mergeSBFLALL"
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    use_cross_attn_fusion: true
    cross_attn_heads: 4

  - name: "l_dsgraph_cross_attn_balanced"
    gnn_type: "l_dsgraph_ablation"
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    num_heads: 5
    cv_method: "kfold"
    k_folds: 5
    variant: "full"
    sbfl_type: "mergeSBFLALL"
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    use_cross_attn_fusion: true
    cross_attn_heads: 4
    fusion_type: "balanced_gate"

  - name: "l_dsgraph_ranking"
    gnn_type: "l_dsgraph_ablation"
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    num_heads: 5
    cv_method: "kfold"
    k_folds: 5
    variant: "full"
    sbfl_type: "mergeSBFLALL"
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    ranking_weight: 0.1
    ranking_margin: 0.1
