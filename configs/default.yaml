data:
  root_data_path: "dataset/"
  sbfl_data_path: "dataset/"
  gramus_data_path: ""
  difficulty_file: "dataset/difficulty.txt"
  data_source: "pickle"
  sbfl_type: "mergeSBFLALL"
  hash_num_bins: 64
  use_full_ast: true
  ast_granularity: "fine"
  stmt_length_file: "dataset/lengs.txt"

training:
  seed: 0
  batch_size: 60
  patience: 30
  use_validation: true
  save_model: true
  model_dir: "model"
  weight_decay: 0.001
  loss_alpha: 0.7
  loss_beta: 0.3
  l1_lambda: 0.0005
  scheduler_T0: 20
  scheduler_T_mult: 2
  grad_clip: 1.0

