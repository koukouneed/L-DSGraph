data:
  root_data_path: "dataset/"
  sbfl_data_path: "dataset/"
  gramus_data_path: ""
  difficulty_file: "dataset/difficulty.txt"
  data_source: "pickle"
  sbfl_type: "mergeSBFLALL"
  hash_num_bins: 64
  use_full_ast: true
  ast_granularity: "fine"
  edge_type: pdg
  stmt_length_file: "dataset/lengs.txt"

training:
  seed: 0
  batch_size: 60
  patience: 30
  use_validation: true
  save_model: true
  model_dir: "model"
  weight_decay: 0.001
  loss_alpha: 0.7
  loss_beta: 0.3
  # loss_schedule:
  #   mode: "cosine"       # linear 或 cosine
  #   alpha_start: 0.3     # 训练初期 listwise 权重（低→BCE主导，训练稳定）
  #   alpha_end: 0.7       # 训练末期 listwise 权重（高→排序优化主导）
  #   beta_start: 0.7      # 训练初期 BCE 权重
  #   beta_end: 0.3        # 训练末期 BCE 权重
  #   warmup_epochs: 5     # 前N个epoch保持start值不变
  l1_lambda: 0.0005
  scheduler_T0: 20
  scheduler_T_mult: 2
  grad_clip: 1.0

