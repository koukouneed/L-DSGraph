  - name: "gnn_full"
    gnn_type: "l_dsgraph_ablation"
    variant: ["full"]
    stratify_by: "difficulty_adaptive"
    sbfl_type: "mergeSBFLALL"
    use_edge_type: true    # 开启边类型编码，默认false
    hidden_dim: 128
    lr: 0.001
    epochs: 120
    cv_method: "kfold"
    k_folds: 5
    num_steps: 5
    dropout: 0.3
    ast_emb_dim: 16
    token_emb_dim: 16

